<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utilitarian Decision Game</title><style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:24px}main{max-width:850px;margin:auto}.card{background:#1e293b;padding:32px;border-radius:20px}.hidden{display:none}.center{text-align:center}button{padding:14px 20px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.primary{background:#38bdf8}.answer{display:block;width:100%;margin:10px 0;text-align:left;background:#263449;color:#fff;border:1px solid #475569}.correct{background:#166534!important}.wrong{background:#881337!important}.top{display:flex;justify-content:space-between}.score{color:#facc15}.bar{height:10px;background:#38bdf8;width:0}.track{height:10px;background:#334155;margin:12px 0 25px}.badge{display:inline-block;background:#0c4a6e;padding:7px 12px;border-radius:99px;margin-bottom:15px}.feedback{margin:18px 0;padding:16px;background:#172033;border-radius:12px}.final{font-size:4rem;color:#facc15}</style></head><body><main>
<section id="start" class="card center"><div class="badge">THEOLOGY 3 • UTILITARIAN ETHICS</div><h1>The Utilitarian Decision Game</h1><p>20 scenarios covering consequentialism, Act Utilitarianism, Rule Utilitarianism, Preference Utilitarianism, and the basic utilitarian goal.</p><button class="primary" onclick="start()">Start Game</button></section>
<section id="game" class="card hidden"><div class="top"><b id="round"></b><b class="score">Utility: <span id="score"></span></b></div><div class="track"><div id="bar" class="bar"></div></div><div id="q"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="primary hidden" onclick="next()">Next Scenario →</button></section>
<section id="end" class="card center hidden"><div class="badge">GAME COMPLETE</div><h1>Your Result</h1><div id="final" class="final"></div><h2 id="rank"></h2><p id="msg"></p><button class="primary" onclick="start()">Play Again</button></section>
</main><script>
const A=[
["Act Utilitarianism","A hospital must choose between Treatment A and B. A produces more overall benefit in this particular case. What should it choose?",["Treatment A, because it produces more good in this case.","Treatment B because hospitals should never compare outcomes.","Either, because intentions are all that matter."],"Act evaluates the individual action and chooses what maximizes the good."],
["Act Utilitarianism","A city has $10,000. Repairing a dangerous bridge is expected to prevent much more harm than improving a park. What should an act utilitarian do?",["Repair the bridge because it creates more overall good.","Improve the park automatically.","Split the money equally regardless of consequences."],"The particular consequences of the choice determine the best action."],
["Act Utilitarianism","A teacher considers giving one student an extension. In this specific case it would create more overall benefit. What should the teacher do?",["Give the extension because it maximizes the good in this case.","Always refuse extensions.","Decide based only on intentions."],"Act Utilitarianism asks whether the specific action maximizes the good."],
["Rule Utilitarianism","A school is creating a late-assignment policy. Which approach fits Rule Utilitarianism?",["Create a general rule known to maximize the good across many similar cases.","Decide every case with no general rule.","Always reject late work."],"Rule Utilitarianism develops rules covering many situations that maximize the good."],
["Rule Utilitarianism","A hospital is designing a general policy for limited resources. What should a rule utilitarian focus on?",["A rule that maximizes the good across many cases.","Only one unusual case.","Administrators' intentions."],"The focus is a general rule that maximizes good across situations."],
["Rule Utilitarianism","A town wants a general traffic rule. Which reasoning fits Rule Utilitarianism?",["Adopt the rule expected to maximize overall good across many traffic situations.","Choose whatever helps one driver today.","Ignore consequences."],"Rule Utilitarianism looks for rules that maximize good in many situations."],
["Preference Utilitarianism","A city is choosing community projects. Residents have different interests and preferences. What should a preference utilitarian emphasize?",["Satisfaction of the preferences or interests of those affected.","Only the mayor's preference.","Only the cheapest project."],"Preference Utilitarianism focuses on maximizing satisfaction of affected preferences or interests."],
["Preference Utilitarianism","A hospital considers treatment plans affecting a patient and family. Which approach fits Preference Utilitarianism?",["Maximize satisfaction of relevant preferences and interests.","Use only the doctor's preference.","Choose randomly."],"The focus is preferences or interests of all those affected."],
["Preference Utilitarianism","A community is deciding between two projects. Residents have different preferences. Which reasoning is preference utilitarian?",["Choose the option that best maximizes satisfaction of affected people's preferences or interests.","Choose the council's favorite.","Ignore preferences."],"Preference Utilitarianism maximizes satisfaction of preferences or interests."],
["Consequentialism","Policy X has good intentions but much worse results than Policy Y. Y produces more overall good. Which fits consequentialism?",["Policy Y, because consequences and outcomes matter.","X, because intentions automatically decide morality.","Either, because outcomes do not matter."],"Utilitarianism is consequentialist: consequences or outcomes are what matter."],
["Consequentialism","Someone says an action was moral because of good intentions even though the result was much worse. What would a utilitarian say?",["Consequences are crucial; good intentions alone do not determine the answer.","Intentions are always more important.","The outcome should never be considered."],"Utilitarianism evaluates actions by their consequences."],
["Consequentialism","A policy is unpopular with some people but produces a very large amount of good for many. What should a utilitarian primarily consider?",["The overall consequences and amount of good produced.","Whether everyone likes it.","Only the government's intentions."],"Overall consequences are central to utilitarian reasoning."],
["Basic Utilitarian Goal","Project A helps 100 people a lot. Project B helps 2,000 moderately and produces more total benefit. Which fits the basic goal?",["Project B, because it produces more overall good.","Project A automatically.","Neither, because numbers never matter."],"The goal is the most amount of good for the most amount of people."],
["Basic Utilitarian Goal","A charity can strongly benefit a small group or give a smaller benefit to a much larger group, with the second producing more total good. What should a utilitarian prefer?",["The option producing more overall good.","The smaller group automatically.","Whichever has better intentions."],"Utilitarianism seeks to maximize total good."],
["Basic Utilitarian Goal","A government program can greatly help 50 people or substantially help 1,000, with the second producing more overall good. What fits utilitarianism?",["The program producing more overall good.","The program helping fewer people automatically.","Neither."],"The core goal is maximizing good overall."],
["Match the Theory","Which matching is correct?",["Bentham = Act; Mill = Rule; Harsanyi = Preference.","Bentham = Rule; Mill = Preference; Harsanyi = Act.","Bentham = Preference; Mill = Act; Harsanyi = Rule."],"Your notes identify Bentham with Act, Mill with Rule, and Harsanyi with Preference Utilitarianism."],
["Match the Theory","Which matching is correct?",["Individual action = Act; general rules = Rule; preferences/interests = Preference.","Individual action = Rule; general rules = Preference; preferences/interests = Act.","Individual action = Preference; general rules = Act; preferences/interests = Rule."],"Act focuses on individual actions, Rule on general rules, and Preference on preferences or interests."],
["Distinguish the Theories","Identify the theory: 'What should I do right now?' 'What general rule should we adopt?' 'Whose preferences or interests should be satisfied?'",["Act → Rule → Preference.","Rule → Preference → Act.","Preference → Act → Rule."],"The questions correspond to individual action, general rule, and preferences/interests."],
["Act vs. Rule","Act and Rule Utilitarianism both seek to maximize the good. What is the key difference?",["Act evaluates individual actions; Rule evaluates rules covering many situations.","Act evaluates rules; Rule evaluates individual actions.","Act focuses on intentions."],"Both maximize good, but Act evaluates the particular action while Rule evaluates general rules."],
["Final Boss","One person wants to maximize good in this particular decision. Another wants a rule that maximizes good across similar cases. A third wants to maximize satisfaction of everyone affected. Which sequence is correct?",["Act → Rule → Preference.","Rule → Act → Preference.","Preference → Rule → Act."],"Particular decision = Act; general rule = Rule; preferences/interests = Preference."]
];
let i=0,s=50,done=false;function start(){i=0;s=50;document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('game').classList.remove('hidden');show()}function show(){done=false;let x=A[i];round.textContent='Round '+(i+1)+' / 20';score.textContent=s;bar.style.width=(i/20*100)+'%';feedback.classList.add('hidden');next.classList.add('hidden');q.innerHTML='<div class="badge">'+x[0]+'</div><h2>'+x[1]+'</h2>'+x[2].map((v,n)=>'<button class="answer" onclick="pick('+n+')">'+v+'</button>').join('')}function pick(n){if(done)return;done=true;let x=A[i],bs=document.querySelectorAll('.answer');bs.forEach((b,k)=>{b.disabled=true;if(k===0)b.classList.add('correct');if(k===n&&n!==0)b.classList.add('wrong')});let ok=n===0;s+=ok?10:-8;score.textContent=s;feedback.innerHTML='<b>'+(ok?'✓ Correct!':'✗ Not quite.')+'</b><br>'+x[3];feedback.classList.remove('hidden');next.textContent=i===19?'See Results →':'Next Scenario →';next.classList.remove('hidden')}function next(){if(i<19){i++;show()}else results()}function results(){game.classList.add('hidden');end.classList.remove('hidden');final.textContent=s;let r=s>=90?'🏆 Utilitarian Master':s>=75?'📚 Utilitarian Scholar':s>=60?'🎓 Ethics Student':'🌱 Ethical Apprentice';rank.textContent=r;msg.textContent=s>=90?'Excellent understanding of the utilitarian framework.':s>=75?'Strong work on the major utilitarian ideas.':s>=60?'You have the foundations down. Review the three types.':'Keep practicing the differences between Act, Rule, and Preference Utilitarianism.'}</script></body></html>
